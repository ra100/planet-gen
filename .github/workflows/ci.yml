name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Linux: install GPU/display dependencies for wgpu and OpenEXR (native EXR writer)
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev mesa-vulkan-drivers libopenexr-dev

      # macOS: OpenEXR for the native EXR writer (pkg-config metadata from Homebrew)
      - name: Install OpenEXR (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openexr
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      # Windows: OpenEXR from vcpkg; bin dir on PATH so tests can load the shared library
      - name: Cache vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\packages
            C:\vcpkg\downloads
            C:\vcpkg\installed\x64-windows
          key: vcpkg-openexr-1

      - name: Install OpenEXR (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install openexr:x64-windows
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\vcpkg\installed\x64-windows\bin"

      - name: Build
        run: cargo build --all-targets

      - name: Run lib tests (no GPU tests in CI)
        run: cargo test --lib -- --skip gpu --skip preview --skip export
        env:
          WGPU_BACKEND: gl

  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
