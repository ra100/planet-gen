name: Bug report
description: Something does not work or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Planet Gen version
      description: Shown in the window title, or run `planet-gen --version`.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: OS and GPU
      placeholder: "Windows 11, NVIDIA RTX 3070, driver 560.94"
    validations:
      required: true
  - type: textarea
    id: planet
    attributes:
      label: Planet file or settings
      description: Attach a saved planet file (SAVE AS…), or list the preset, seed, and settings you changed.
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: For startup or GPU problems, run `RUST_LOG=info planet-gen` from a terminal and paste the output.
      render: text
