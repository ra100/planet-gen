[package]
name = "planet-gen"
version = "0.1.0"
edition = "2024"
description = "GPU-accelerated procedural planet generator for VFX"
license = "MIT"

[features]
validation = []

[[bin]]
name = "sweep"
path = "src/bin/sweep.rs"
required-features = ["validation"]

[dependencies]
# GPU compute
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# UI
eframe = { version = "0.33", features = ["wgpu"] }
egui = "0.33"

# Image export
image = "0.25"
exr = "1.74"
png = "0.18"

# Utilities
log = "0.4"
env_logger = "0.11"
thiserror = "2"
half = "2"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[lints.clippy]
# Strided iteration over GPU buffers uses chunks_exact throughout the
# preview/export hot paths; as_chunks tuples do not compose with .zip()
# chains, so keep the existing idiom.
chunks_exact_to_as_chunks = "allow"
