[package]
name = "planet-gen"
version = "0.3.0"
edition = "2024"
description = "GPU-accelerated procedural planet generator for VFX"
license = "MIT"
authors = ["ra100"]
repository = "https://github.com/ra100/planet-gen"
homepage = "https://github.com/ra100/planet-gen"
readme = "README.md"
keywords = ["procedural", "planet", "terrain", "wgpu", "vfx"]
categories = ["graphics", "rendering", "simulation"]
default-run = "planet-gen"

[features]
validation = []

[[bin]]
name = "sweep"
path = "src/bin/sweep.rs"
required-features = ["validation"]

[dependencies]
# GPU compute
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# UI
eframe = { version = "0.33", features = ["wgpu", "persistence"] }
egui = "0.33"

# Image export
image = "0.25"
exr = "1.74"
png = "0.18"

# Serialization + native file dialogs (planet save/load)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"

# Utilities
memmap2 = "0.9"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
half = "2"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[lints.clippy]
# Strided iteration over GPU buffers uses chunks_exact throughout the
# preview/export hot paths; as_chunks tuples do not compose with .zip()
# chains, so keep the existing idiom.
chunks_exact_to_as_chunks = "allow"

# Debug builds spend most of their startup inside naga's WGSL translation and
# wgpu-core validation (the weather and preview shaders are large): unoptimized,
# the first frame took ~100s. Optimizing just these crates keeps `cargo run`
# starting in seconds without slowing incremental builds of our own code.
[profile.dev.package.naga]
opt-level = 3

[profile.dev.package.wgpu-core]
opt-level = 3

[profile.dev.package.wgpu-hal]
opt-level = 3
